name: Check Runner Specs

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  specs:
    name: Specs (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Info runner
        shell: bash
        run: |
          echo "OS     : $RUNNER_OS"
          echo "Arch   : $RUNNER_ARCH"
          echo "Name   : $RUNNER_NAME"
          echo "Image  : ${ImageOS:-n/a} ${ImageVersion:-n/a}"

      - name: Spek Linux
        if: runner.os == 'Linux'
        run: |
          cat /etc/os-release | head -n 3
          uname -a
          echo "--- CPU ---"
          lscpu | grep -E "Model name|^CPU\(s\)|Thread|Core|MHz"
          echo "--- RAM ---"
          free -h
          echo "--- Disk ---"
          df -h /

      - name: Spek macOS
        if: runner.os == 'macOS'
        run: |
          sw_vers
          echo "--- CPU ---"
          sysctl -n machdep.cpu.brand_string
          echo "Cores: $(sysctl -n hw.ncpu)"
          echo "--- RAM ---"
          echo "$(( $(sysctl -n hw.memsize) / 1024 / 1024 / 1024 )) GB"
          echo "--- Disk ---"
          df -h /

      - name: Spek Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, OSArchitecture | Format-List
          Get-CimInstance Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors | Format-List
          $ram = (Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB
          Write-Host ("RAM: {0:N1} GB" -f $ram)
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, Used, Free
          
