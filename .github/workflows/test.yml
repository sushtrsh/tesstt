name: Cek Disk Runner

on:
  workflow_dispatch:

jobs:
  cek-disk:
    runs-on: ubuntu-latest
    steps:
      - name: Ringkasan disk (df)
        run: df -h

      - name: Ukuran folder besar di /
        run: sudo du -xh / --max-depth=1 2>/dev/null | sort -rh | head -20

      - name: Folder besar di /usr, /opt, dan /home
        run: |
          sudo du -xh /usr --max-depth=2 2>/dev/null | sort -rh | head -15
          sudo du -xh /opt --max-depth=1 2>/dev/null | sort -rh | head -10
          sudo du -xh /home --max-depth=1 2>/dev/null | sort -rh | head -10
      - name: Info workspace dan memori
        run: |
          echo "Workspace: $GITHUB_WORKSPACE"
          df -h "$GITHUB_WORKSPACE"
          free -h
          nproc
